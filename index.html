<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#131820">
  <link rel="icon" href="icon192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <title>MuscleFit 6.0</title>
</head>
<body>
  <main>
    <header>
      <h1>MUSCLE<em>FIT</em> 6.0</h1>
      <button id="install" hidden>Install app</button>
      <button id="update" hidden>Load update</button>
    </header>
    <nav id="groups" aria-label="Muscle groups"></nav>
    <h2 id="title"></h2>
    <div id="stage"></div>
    <p id="status" role="status">Loading exercise viewer…</p>
    <div id="legend" hidden>
      <span><i class="primary"></i>Primary <b id="primary"></b></span>
      <span id="secondary-label"><i class="secondary"></i>Secondary <b id="secondary"></b></span>
    </div>
    <div id="viewer-controls" class="controls" aria-label="Viewer controls">
      <button id="play">Pause</button>
      <select id="speed" aria-label="Animation speed">
        <option value="1">1× speed</option>
        <option value=".5">0.5× speed</option>
        <option value=".25">0.25× speed</option>
      </select>
      <button id="orbit" aria-pressed="false">Orbit</button>
      <button id="left" aria-label="Rotate left">←</button>
      <button id="right" aria-label="Rotate right">→</button>
      <button id="closer" aria-label="Zoom in">+</button>
      <button id="farther" aria-label="Zoom out">−</button>
      <button id="fit">Reset view</button>
    </div>
    <section aria-label="Current set">
      <div id="stats"></div>
      <p id="tip"></p>
      <button id="log">Complete set</button>
      <p id="rest"></p>
    </section>
    <section>
      <h3>Exercises</h3>
      <div id="exercises" class="controls"></div>
    </section>
    <section>
      <h3>Workout history</h3>
      <div id="history"></div>
      <button id="reset">Clear history</button>
    </section>
    <details>
      <summary>Import your own model</summary>
      <label for="model">Self-contained animated GLB</label>
      <input id="model" type="file" accept=".glb">
      <select id="clips" aria-label="Animation clip" hidden></select>
      <button id="builtin" hidden>Use bundled athlete</button>
    </details>
  </main>
  <script type="importmap">{"imports":{"three":"./assets/vendor/three.module.min.js"}}</script>
  <script defer src="assets/athlete-model.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
